name: Migrate staging to Next.js 14
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/next14-staging
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Upgrade dependencies to Next.js 14
        run: npm install next@next-14 react@18 react-dom@18
      - name: Build before committing migration
        run: npm run build
      - name: Commit dependency files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Upgrade staging dependencies to Next.js 14"
          git push origin upgrade/next14-staging
