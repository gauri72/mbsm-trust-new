name: Production Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # Daily at 09:00 UTC

permissions:
  contents: read

concurrency:
  group: production-smoke-test
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check production routes
        env:
          BASE_URL: https://mbsm-trust-new.vercel.app
          TIMEOUT_MS: "30000"
        run: node scripts/production-smoke-test.mjs
