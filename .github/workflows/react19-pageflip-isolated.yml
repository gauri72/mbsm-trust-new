name: React 19 isolated pageflip compatibility test
on:
  push:
    branches:
      - upgrade/next14-staging
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pageflip-isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up isolated test app
        working-directory: tests/pageflip-react19
        run: npm install
      - name: Install Playwright browser
        working-directory: tests/pageflip-react19
        run: npx playwright install --with-deps chromium
      - name: Run isolated React 19 runtime tests
        working-directory: tests/pageflip-react19
        run: npm test
